# Continuous Integration: runs on every push and pull request.
# Goal: nothing reaches main without compiling and passing all tests.
# Each service is a separate job, so they run in parallel and fail independently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the automatically provided GITHUB_TOKEN: read-only.
permissions:
  contents: read

jobs:
  transaction-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven   # reuse downloaded dependencies between runs
      # verify = compile + unit tests (surefire) + integration tests (failsafe).
      # GitHub's Ubuntu runners have Docker, so Testcontainers can start PostgreSQL.
      - run: ./mvnw -B verify

  fraud-scoring-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-scoring-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked          # fail if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
