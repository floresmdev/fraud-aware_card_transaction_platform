# Local development environment.
# Phase 1: only PostgreSQL. Phase 3 adds both services so `docker compose up` runs everything.
#
#   docker compose up -d        start in the background
#   docker compose ps           status (and health)
#   docker compose down         stop (data is kept in the named volume)
#   docker compose down -v      stop AND delete the data
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      # Local-only throwaway password, matches the default in application.yml. Not a real secret.
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
